# This file contains common pin mappings for the BIGTREETECH SKR mini
# E3 v1.2. To use this config, the firmware should be compiled for the
# STM32F103 with a "28KiB bootloader". Also, select "Enable extra
# low-level configuration options" and configure "GPIO pins to set at
# micro-controller startup" to "!PC13".

# The "make flash" command does not work on the SKR mini E3. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR
# mini E3 with that SD card.

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 32
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: -36
position_max: 255
position_endstop: -36
homing_speed: 80
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PB15
diag_pin: PC0
run_current: 0.8
#stealthchop_threshold: 999999
#driver_SGTHRS: 90
interpolate: true

[autotune_tmc stepper_x]
motor: creality-42-40
sg4_thrs: 140
tuning_goal: silent

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 32
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: -54
position_max: 254
position_endstop: 254
homing_speed: 80
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PC6
diag_pin: PC1
run_current: 0.8
#stealthchop_threshold: 999999
#driver_SGTHRS: 90
interpolate: true

[autotune_tmc stepper_y]
motor: creality-42-40
sg4_thrs: 140
tuning_goal: silent

[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
#endstop_pin: probe:z_virtual_endstop
#endstop_pin: PC14
endstop_pin: tmc2209_stepper_z:virtual_endstop
position_min: -1
position_max: 245
#position_endstop: -1
homing_speed: 20
homing_retract_dist: 0

[tmc2209 stepper_z]
uart_pin: PC10
diag_pin: PC15
run_current: 1.2
stealthchop_threshold: 999999
driver_SGTHRS: 100
#interpolate: true

#[autotune_tmc stepper_z]
#motor: creality-42-34
#sg4_thrs: 100

[extruder]
step_pin: PB3
dir_pin: PB4
enable_pin: !PD2
microsteps: 16
rotation_distance: 22.598 #22.905740611 #22.6789511
full_steps_per_rotation: 200
gear_ratio: 50:10
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: PC8
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PA0
control = pid
pid_kp = 20.101
pid_ki = 1.441
pid_kd = 70.101
min_temp: -50
max_temp: 300
min_extrude_temp: 0
max_extrude_cross_section: 101
max_extrude_only_distance: 100
pressure_advance: 0.0288
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: PC11
interpolate: true
run_current: 0.850
hold_current: 0.100
sense_resistor: 0.11
stealthchop_threshold: 0 #999999
driver_TBL: 0
driver_HEND: 6
driver_HSTRT: 7
driver_TOFF: 4

#[autotune_tmc extruder]
#motor: usongshine-17hs4023

[verify_heater extruder]
max_error: 120
check_gain_time: 60
hysteresis: 5
heating_gain: 2

[heater_bed]
heater_pin: PC9
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC3
control = pid
pid_kp = 73.716
pid_ki = 1.273
pid_kd = 1067.044
min_temp: 0
max_temp: 130

[fan]
pin: PA8
#kick_start_time: 0.800
#cycle_time: 0.010
cycle_time: 0.06
max_power: 0.5

[mcu]
serial: /dev/ttyAMA0
baud: 250000
restart_method: command

[mcu rpi]
serial: /tmp/klipper_host_mcu

[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_455035712912AB78-if00
restart_method: command

[printer]
kinematics: corexy
max_velocity: 550
max_accel: 10000
max_z_velocity: 30
max_z_accel: 100

[static_digital_output usb_pullup_enable]
pins: !PC13

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5, EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PB6, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PB7, EXP1_10=<5V>

[display]
lcd_type: st7920
cs_pin: EXP1_7
sclk_pin: EXP1_6
sid_pin: EXP1_8
encoder_pins: ^EXP1_5, ^EXP1_3
click_pin: ^!EXP1_2

[output_pin _BEEPER_pin]
pin: EXP1_1
pwm: True
value: 0
shutdown_value: 0
cycle_time: 0.001

#[bltouch]
#sensor_pin: ^PC2
#control_pin: PA1
#x_offset: 0
#y_offset: -30
#z_offset = 1.800
##pin_move_time: 0.4
#pin_up_touch_mode_reports_triggered: False
##pin_up_reports_not_triggered: False
##set_output_mode: 5V
#sample_retract_dist: 2.0
#speed: 50
#lift_speed: 50
#probe_with_touch_mode: True
#stow_on_each_sample: False 

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu # Sets the type of sensor for Klipper to read
sensor_mcu: eddy # Sets the MCU of the eddy probe tempereature sensor
min_temp: 10 # Sets the minimum tempereature for eddys tempereature sensor to operate
max_temp: 100 # Sets the maximum tempereature for eddys tempereature sensor to operate

[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
horizontal_move_z: 2

[probe_eddy_current btt_eddy]
sensor_type: ldc1612
z_offset: 2
#i2c_address:
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: 14.5
y_offset: 35.5
#reg_drive_current = 15

[idle_timeout]
timeout: 1800

[bed_mesh]
speed: 200
horizontal_move_z: 3
mesh_min: 15,15
mesh_max: 220,215
probe_count: 12,12
algorithm: bicubic
mesh_pps: 3,3
#bicubic_tension: 0.4
#fade_start: 1
#fade_end: 10
#fade_target: 0
adaptive_margin: 10

[screws_tilt_adjust]
screw1: 15,-4
screw1_name: front left screw
screw2: 185,-4
screw2_name: front right screw
screw3: 185,166
screw3_name: rear right screw
screw4: 15,166
screw4_name: rear left screw
horizontal_move_z: 10
speed: 200
screw_thread: CW-M4

[adxl345]
cs_pin: rpi:None

[resonance_tester]
accel_chip: adxl345
probe_points: 116,76,20  #belts  middle'ish

[input_shaper]
shaper_freq_x: 53.8
shaper_type_x: zv
shaper_freq_y: 46.8
shaper_type_y: mzv

[gcode_arcs]
resolution: 0.6

[force_move]
enable_force_move: true

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor mcu]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[pause_resume]

[display_status]

[exclude_object]

[virtual_sdcard]
path: /home/pi/printer_data/gcodes

[shaketune]
# https://github.com/Frix-x/klippain-shaketune/blob/main/docs/README.md
result_folder: ~/printer_data/config/ShakeTune_results
#    Path where the processed results will be stored. If the folder doesn't exist,
#    it will be automatically created. You can change this if you'd like to store 
#    results in a different location.
number_of_results_to_keep: 4
#    This setting defines how many results you want to keep in the result folder.
#    Once the specified number is exceeded, older results will be automatically deleted
#    to free up space on the SD card and avoid cluttering the results folder.
keep_raw_data: False
#    If set to True, Shake&Tune will store both the processed graphs and the raw accelerometer
#    .stdata files in the results folder. This can be useful for debugging or archiving purposes.
#    Please always attach them when reporting any issues on GitHub or Discord.
show_macros_in_webui: True
#    Mainsail and Fluidd doesn't create buttons for system commands (macros that are not part
#    of the printer.cfg file). This option allow Shake&Tune to inject them into the webui at runtime.
#    If set to False, the macros will be hidden but still accessible from the console by typing
#    their names manually, which can be useful if you prefer to encapsulate them into your own macros.
timeout: 600
#    This defines the maximum processing time (in seconds) to allows to Shake&Tune for generating 
#    graphs from a .stdata file. 10 minutes should be more than enough in most cases, but if you have
#    slower hardware (e.g., older SD cards or low-performance devices), increase it to prevent timeouts.
# measurements_chunk_size: 2
#    Each Shake&Tune command uses the accelerometer to take multiple measurements. By default,
#    Shake&Tune will write a chunk of data to disk every two measurements, and at the end of the
#    command will merge these chunks into the final .stdata file for processing. "2" is a very
#    conservative setting to avoid Klipper Timer Too Close errors on lower end devices with little
#    RAM, and should work for everyone. However, if you are using a powerful computer, you may
#    wish to increase this value to keep more measurements in memory (e.g., 15-20) before writing
#    the chunk and avoid stressing the filesystem too much.
# max_freq: 200
#    This setting defines the maximum frequency at which the calculation of the power spectral density
#    is cutoff. The default value should be fine for most machines and accelerometer combinations and
#    avoid touching it unless you know what you're doing.
# dpi: 300
#    Controls the resolution of the generated graphs. The default value of 300 dpi was optimized
#    and strikes a balance between performance and readability, ensuring that graphs are clear
#    without using too much RAM to generate them. Usually, you shouldn't need to change this value.

#[gcode_button kill_switch]
#pin: PC14
##pin: tmc2209_stepper_z:virtual_endstop
#press_gcode:
#  M104 S0 ; turn off temperature
#  M140 S0 ; turn off temperature of bed (MD)
#  M106 S0 ; turn off cooling fan
#  G91 ; use relative positioning for the XYZ axes
